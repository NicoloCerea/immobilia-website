<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prenotazione confermata — Immobilia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#173226; --forest-dark:#0f2119; --cream:#F6F2E9; --cream-soft:#EFE8D8;
    --gold:#B9974E; --ink:#22261F; --ink-soft:#5B5F52; --line:#E3DCC9; --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;min-height:100vh;}
  h1{font-family:'Fraunces',serif;}
  a{color:var(--forest);}
  .wrap{max-width:560px;margin:0 auto;padding:60px 32px 80px;}
  .logo{display:flex;justify-content:center;margin-bottom:40px;}
  .logo img{height:38px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:36px;box-shadow:0 12px 30px rgba(15,33,25,.08);}
  .check-icon{width:56px;height:56px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;}
  h1{font-size:24px;font-weight:500;text-align:center;margin-bottom:6px;}
  .subtitle{text-align:center;font-size:14px;color:var(--ink-soft);margin-bottom:32px;}
  .detail-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .detail-row:last-of-type{border-bottom:none;}
  .detail-row span:first-child{color:var(--ink-soft);}
  .detail-row span:last-child{font-weight:600;text-align:right;}
  .amount-box{background:var(--cream-soft);border-radius:10px;padding:18px 20px;margin:24px 0;}
  .amount-box .paid-now{display:flex;justify-content:space-between;align-items:baseline;}
  .amount-box .paid-now span:first-child{font-size:14px;color:var(--ink-soft);}
  .amount-box .paid-now span:last-child{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--forest);}
  .balance-note{margin-top:10px;font-size:12.5px;color:var(--ink-soft);background:#fff;border-radius:8px;padding:10px 12px;}
  .loading{text-align:center;padding:40px 0;color:var(--ink-soft);font-size:14px;}
  .error-box{text-align:center;padding:20px 0;color:var(--ink-soft);font-size:14px;}
  .cta{display:block;text-align:center;background:var(--forest);color:#fff;text-decoration:none;padding:14px;border-radius:10px;font-weight:700;font-size:14px;margin-top:28px;}
  .cta:hover{background:var(--forest-dark);}
  .footer-note{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="index.html"><img src="images/logo/immobilia-logo.png" alt="Immobilia"></a>
  <div class="card" id="confirmation-card">
    <div class="loading">Verifica del pagamento in corso...</div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  const card = document.getElementById('confirmation-card');

  function fmtDate(d) {
    if (!d) return "";
    return d.split("-").reverse().join("/");
  }

  async function loadConfirmation() {
    if (!sessionId) {
      card.innerHTML = '<div class="error-box">Nessuna prenotazione da mostrare. Se hai appena pagato e vedi questo messaggio, scrivici a <strong>immobiliaita@gmail.com</strong> con la ricevuta ricevuta via email.</div>';
      return;
    }

    try {
      const res = await fetch(`/api/booking-confirmation?session_id=${encodeURIComponent(sessionId)}`);
      const data = await res.json();

      if (!data.paid) {
        card.innerHTML = '<div class="error-box">Il pagamento non risulta ancora completato. Se hai già pagato, attendi qualche secondo e ricarica la pagina, oppure scrivici a <strong>immobiliaita@gmail.com</strong>.</div>';
        return;
      }

      const balance = data.payMode === "deposit" ? Math.round((data.fullTotal - data.amountPaid) * 100) / 100 : 0;

      card.innerHTML = `
        <div class="check-icon">✓</div>
        <h1>Prenotazione confermata</h1>
        <div class="subtitle">Riceverai a breve una ricevuta via email da Stripe.</div>

        <div class="detail-row"><span>Appartamento</span><span>${data.propertyName || ""}</span></div>
        <div class="detail-row"><span>Check-in</span><span>${fmtDate(data.checkin)}</span></div>
        <div class="detail-row"><span>Check-out</span><span>${fmtDate(data.checkout)}</span></div>
        <div class="detail-row"><span>Ospiti</span><span>${data.guests || ""}${data.hasPet ? " + animale" : ""}</span></div>

        <div class="amount-box">
          <div class="paid-now">
            <span>${data.payMode === "deposit" ? "Acconto pagato ora" : "Totale pagato"}</span>
            <span>€${data.amountPaid}</span>
          </div>
          ${balance > 0 ? `<div class="balance-note">Saldo rimanente di <strong>€${balance}</strong> (su un totale di €${data.fullTotal}) da versare prima dell'arrivo, come da policy di cancellazione.</div>` : ""}
        </div>

        <a class="cta" href="${data.property ? data.property + '.html' : 'index.html'}">Torna all'annuncio</a>
      `;
    } catch (err) {
      card.innerHTML = '<div class="error-box">Non riusciamo a verificare il pagamento in questo momento. Se hai già pagato, controlla la tua email per la ricevuta di Stripe, oppure scrivici a <strong>immobiliaita@gmail.com</strong>.</div>';
    }
  }

  loadConfirmation();
</script>

</body>
</html>
